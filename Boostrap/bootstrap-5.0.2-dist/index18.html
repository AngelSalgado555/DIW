<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ms-auto</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        .row{
            background: salmon;
            margin-top: 20px;
        }

        .contenido{
            background: #fff;
            text-align: center;
            padding: 20px;
            border: 1px solid blueviolet;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="contenido col order-4 order-md-1"> Comuna #1 </div>
            <div class="contenido col order-3 order-md-2"> Comuna #2 </div>
            <div class="contenido col order-2 order-md-3"> Comuna #3 </div>
            <div class="contenido col order-1 order-md-4"> Comuna #4 </div>
        </div>
        <div class="row">
            <div class="contenido col-3 offset-3 offset-sm-6"> Columnna #1 </div>
        </div>
        <div class="row">
            <div class="contenido col-3 offset-3"> Columna #1 </div>
            <div class="contenido col-3 offset-3"> Columna #2 </div>
        </div>
        <div class="row">
        <!-- <div class="row justify-content-between"> --> <!-- Esta también es una forma de separarlos -->
            <div class="contenido col-auto"> Angel 1 </div>
            <div class="contenido col-auto ms-auto"> Angel Gabriel Salgado Licona </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Botones que se desactiven y que queden fijos </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        body{
            background: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row mt-4">
            <div class="col-12">
                <div class="btn-group" role="group" aria-level="Grupo de botones">
                    <input type="checkbox" class="btn-check" name="checkbox-1" id="checkbox-1">
                    <label for="checkbox-1" class="btn btn-primary"> Checkbox 1 </label>

                    <input type="checkbox" class="btn-check" name="checkbox-2" id="checkbox-2">
                    <label for="checkbox-2" class="btn btn-primary"> Checkbox 2 </label>

                    <input type="checkbox" class="btn-check" name="checkbox-3" id="checkbox-3">
                    <label for="checkbox-3" class="btn btn-primary"> Checkbox 3 </label>
                </div>
                <div class="col-12">
                    <hr class="mt-4">
                    <div class="btn-group" role="group" aria-level="Grupo de botones">
                        <input type="radio" class="btn-check" name="radio" id="radio-1">
                        <label for="radio-1" class="btn btn-primary"> Radio 1</label>

                        <input type="radio" class="btn-check" name="radio" id="radio-2">
                        <label for="radio-2" class="btn btn-primary"> Radio 2</label>

                        <input type="radio" class="btn-check" name="radio" id="radio-3">
                        <label for="radio-3" class="btn btn-primary"> Radio 3</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Carrusel </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col">
                <div class="carousel slide" id="first-carousel" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="img/imgBootstrap/img/carousel1.jpg" alt="">
                        </div>

                        <div class="carousel-item">
                            <img src="img/imgBootstrap/img/carousel2.jpg" alt="">
                        </div>

                        <div class="carousel-item">
                            <img src="img/imgBootstrap/img/carousel3.jpg" alt="">
                        </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#primer-carousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden"> Anterior </span>
                    </button>

                    <button class="carousel-control-next" type="button" ></button>

                    <div class="carousel-indicators">
                        <button class="active" data-bs-target="#primer-carousel" data-bs-slide-to="0" aria-label="Slide 1" type="button">

                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

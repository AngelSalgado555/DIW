<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Paises </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        body{
            background: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row mt-3">
            <select name="pais" id="pais" class="form-select mb-3" aria-label="Selección de país">
                <option value="francia"> Francia </option>
                <option value="españa"> España </option>
                <option value="portugal"> Portugal </option>
            </select>

            <select name="pais" id="pais" class="form-select form-select-lg mb-3" aria-label="Selección de país">
                <option value="francia"> Francia </option>
                <option value="españa"> España </option>
                <option value="portugal"> Portugal </option>
            </select>

            <select name="pais" id="pais" class="form-select form-select-sm mb-3" aria-label="Selección de país">
                <option value="francia"> Francia </option>
                <option value="españa"> España </option>
                <option value="portugal"> Portugal </option>
            </select>

            <!-- Elección multiple -->
            <select multiple size="" name="pais" id="pais" class="form-select mb-3" aria-label="Selección de país">
                <option value="francia"> Francia </option>
                <option value="españa"> España </option>
                <option value="portugal"> Portugal </option>
                <option value="italia"> Italia </option>
                <option value="rusia"> Rusia </option>
            </select>
            <!-- Deshabilitado -->
            <select disabled name="pais" id="pais" class="form-select mb-3" aria-label="Selección de país">
                <option value="francia"> Francia </option>
                <option value="españa"> España </option>
                <option value="portugal"> Portugal </option>
                <option value="italia"> Italia </option>
                <option value="rusia"> Rusia </option>
            </select>
        </div>
    </div>
</body>
</html>

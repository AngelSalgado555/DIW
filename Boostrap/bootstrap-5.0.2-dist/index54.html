<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Checkbox 8 </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row mt-3">
            <!-- Checkboxs -->
            <div class="col-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="checkbox-1" id="checkbox-1">
                    <label for="checkbox-1" class="form-check-label"> Checkbox 1</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="checkbox-2" id="checkbox-2">
                    <label for="checkbox-2" class="form-check-label"> Checkbox 2</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="checkbox-3" id="checkbox-3">
                    <label for="checkbox-3" class="form-check-label"> Checkbox 3</label>
                </div>
            </div>

            <!-- Radios -->
            <div class="col-4">
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="mi-radio-button" id="radio-1">
                    <label for="radio-1" class="form-check-label"> Radio 1</label>
                </div>

                <div class="form-check">
                    <input type="radio" class="form-check-input" name="mi-radio-button" id="radio-2">
                    <label for="radio-2" class="form-check-label"> Radio 2</label>
                </div>

                <div class="form-check">
                    <input type="radio" class="form-check-input" name="mi-radio-button" id="radio-3">
                    <label for="radio-3" class="form-check-label"> Radio 3</label>
                </div>
            </div>

            <!-- Switch -->
            <div class="col-4">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" name="checkbox-1" id="checkbox-1">
                    <label for="checkbox-1" class="form-check-label"> Switch 1</label>
                </div>

                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" name="checkbox-2" id="checkbox-2">
                    <label for="checkbox-2" class="form-check-label"> Switch 2</label>
                </div>

                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" name="checkbox-3" id="checkbox-3">
                    <label for="checkbox-3" class="form-check-label"> Switch 3</label>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Input_group </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        body{
            background: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row mt-3">
            <div class="col-6">
                <!-- Input Group -->
                 <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Nombre" aria-label="Nombre">
                    <span class="input-group-text"> @gmail.com </span>
                 </div>
                 <!-- Textarea -->
                 <div class="input-group mb-3">
                    <span class="input-group-text"> Notas: </span>
                    <textarea name="" id="label-notas" class="form-control" aria-label="Notas"></textarea>
                 </div>

                 <!-- Input Group -->
                 <div class="input-group mb-3">
                    <span class="input-group-text"> Nombre </span>
                    <input type="text" class="form-control" aria-label="Nombre">

                    <span class="input-group-text"> Apellido </span>
                    <input type="text" class="form-control" aria-label="Apellido">
                 </div>
            </div>

            <!-- En pequeño con sm y con el mismo nombre en lg -->
            <div class="col-6">
                <div class="input-group input-group-sm mb-3">
                    <span class="input-group-text"> Pequeño </span>
                    <input type="text" class="form-control" aria-label="Nombre">
                </div>
                <div class="input-group input-group-lg mb-3">
                    <span class="input-group-text"> Pequeño </span>
                    <input type="text" class="form-control" aria-label="Nombre">
                </div>

                <!-- Selector de pais con boton de enviar -->
                <div class="input-group">
                    <label for="pais" class="input-group-text"> Pais </label>
                    <select name="" id="pais" class="form-select">
                        <option value="italia"> Italia </option>
                        <option value="españa"> España </option>
                        <option value="francia"> Francia </option>
                    </select>
                    <button class="btn btn-primary"> Enviar </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

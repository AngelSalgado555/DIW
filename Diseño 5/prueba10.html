<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Gradients de colores </title>
    <style>
        body{
            font-size: 30px;
            background-color: black;
        }
        
        .principal div{
            border: solid white 20px;
            border-radius: 10px;
            margin: 10px;
            width: 500px;
            height: 500px;
            display: inline-block;
        }

        .caja1{
            background-image: linear-gradient(red 45%, blue 50%);
        }

        .caja2{
            background-image: linear-gradient(red 75%, blue);
        }

        .caja3{
            background: linear-gradient(to left, pink, blue, yellow, green)
        }

        .caja4{
            background: linear-gradient(to left top, pink, blue, yellow, green);
        }

        .caja5{
            background: radial-gradient( pink, blue, yellow, green);
        }

        .caja6{
            background: radial-gradient( yellow 80%, green 20%);
        }

        .caja7{
            background: radial-gradient( yellow 50px, green);
        }   

        .caja8{
            background: repeating-radial-gradient(red, blue 20%);
        }

        .caja9{
            background: repeating-radial-gradient(circle at 20%,red,red 10px,green 10px,green 20px)
        }

        .caja10{
            background: repeating-radial-gradient(farthest-corner at 50px 50px, orange 30%, yellow 60%);
        }



    </style>
</head>
<body>
    <div class="principal">
        <div class="caja1">
            Texto sin importancia
        </div>
        <div class="caja2">
            Texto sin importancia
        </div>
        <div class="caja3">
            Texto sin importancia
        </div>
        <div class="caja4">
            Texto sin importancia
        </div>
        <div class="caja5">
            Texto sin importancia
        </div>
        <div class="caja6">
            Texto sin importancia
        </div>
        <div class="caja7">
            Texto sin importancia
        </div>
        <div class="caja8">
            Texto sin importancia
        </div>
        <div class="caja9">
            Texto sin importancia
        </div>
        <div class="caja10">
            Texto sin importancia
        </div>
    </div>
</body>
</html>

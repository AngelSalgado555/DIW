<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Practicando trasnsición </title>
    <style>
        .principal{
            padding: 20px 5px;
            background: aqua;
        }
        .caja{
            background-color: yellow;
            height: 100px;
            width: 100px;
            transition-property: all;
            transition-duration:1s, 2s;
            margin: 40px;
            border: 2px solid #ffff;
            position: relative;
            left: 0%;
        }

        .principal:hover > .caja{
            background: orange;
            left: 80%;
            border: 5px solid greenyellow;
            margin: 100px;
        }

        .caja:first-child{
            transition-timing-function: linear;
        }

        .caja:nth-child(2){
            transition-timing-function: ease;
        }

        .caja:nth-child(3){
            transition-timing-function: ease-in;
        }

        .caja:nth-child(4){
            transition-timing-function: ease-in-out;
        }

        .caja:nth-child(5){
            transition-timing-function: ease-out;
        }




    </style>
</head>
<body>
    <div class="principal">
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/697908d42a.js" crossorigin="anonymous">

    </script>
    <title> Menu Responsive </title>
    <style>
        .nav{
            margin: 10px;
            display: inline-block;
            font-size: 25px;
            padding: 10px;
            
        } 

        .nav ul{
            border: solid 2px;
            background-color: blue;
            width: 1750px;
        }

        .nav li{
            color: white;
        }
        .nav li a{
            color: white;
        }

        .nav li a:hover{
            color: black;
        }
        .nav li a:active{
            color: red;
        }

    </style>
</head>
<body>
    <nav class="nav">
        <ul class="nav ul">
            <li class="nav li"><i class="fas fa-house-user"></i><a href="#"> Inicio </a></li>
            <li class="nav li"><i class="fas fa-users"></i><a href="#"> Usuarios </a></li>
            <li class="nav li"><i class="fas fa-concierge-bell"></i><a href="#"> Servicios </a></li>
            <li class="nav li"><i class="fas fa-file-signature"></i><a href="#"> Contacto </a></li>
        </ul>
    </nav>
</body>
</html>

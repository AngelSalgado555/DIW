<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Colores </title>
    <style>
        .principal{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px;
        }
        .principal div{
            display: inline-block;
            border: 4px solid orange;
            border-radius: 5px;
            height: 200px;
            width: 200px;
            font-size: medium;
        
            
        }
        .caja1{
            background-color: rgb(0, 128, 128);
        }

        .caja1:active{
            background-color: pink;
        }

        .caja2{
            background-color: rgb(255, 255, 0);
        }

        .caja2:active{
            background-color: green;
        }

        .caja3{
            background-color: rgb(125, 125, 125);
        }

        .caja3:active{
            background-color: blue;
        }

        .caja4{
            background-color: rgb(0, 255, 255);
        }

        .caja4:active{
            background-color: red;
        }
    </style>
</head>
<body>
    <h1> Practicando Colores con los números de RGB </h1>
    <div class="principal">
        <div class="caja1">
            Hola 
            </div>
        <div class="caja2">
            Hola 
        </div>
        <div class="caja3">
            Hola 
        </div>
        <div class="caja4">
            Hola 
        </div>
    </div>
</body>
</html>

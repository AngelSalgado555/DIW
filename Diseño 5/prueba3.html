<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Practicar con el Alpha</title>
    <style>
        .principal{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px;
            background-color: red;
            width: 1100px;
            height: 300px;
        }

        .principal div{
            display: inline-block;
            border: 4px solid orange;
            border-radius: 5px;
            height: 200px;
            width: 200px;
            font-size: medium;
        }

        .caja1{
            background-color: teal;
            opacity: 0.5;

        }

        .caja2{
            background-color: teal;
            opacity: 0.5;
        }

        .caja3{
            background-color: #008080;
            opacity: 0.5;
        }

        .caja4{
            background-color: rgb(255, 255, 0);
        }
    </style>
</head>
<body>
    <h1> Prueba de pasar cierta tonalidad del Alpha a los divs que tiene dentro</h1>
    <div class="principal">
        <div class="caja1">
            Hola
        </div>
        <div class="caja2">
            Hola
        </div>
        <div class="caja3">
            Hola
        </div>
        <div class="caja4">
            Hola
        </div>
    </div>
</body>
</html>

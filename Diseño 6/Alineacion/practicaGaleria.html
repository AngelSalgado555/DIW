<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Practica </title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        body{
            background: radial-gradient(circle, pink, red, orange);
            padding: 20px;
        }

        .container{
            display: grid;
            padding: 20px;
            height: 1500px;
            grid-template-rows: 1fr, 1fr; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            grid-gap: 20px;
            grid-auto-rows: 100px;
            grid-auto-flow: dense;

        }

        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        img:first-child{
            grid-column: 1/3;
            grid-row: 1/3;
        }

        img:nth-child(2){
            grid-column: 3/5;
            grid-row: 1/2;
        }

        img:nth-child(4){
            grid-column: 3/5;
            grid-row: 2/3;
        }

        img:nth-child(3){
            grid-column: 1/3;
            grid-row: 3/7;
        }

        img:nth-child(8){
            grid-column: 3/5;
            grid-row: 3/7;
        }

        img:nth-child(7){
            grid-column: 1/3;
            grid-row: span 3;
        }

        img:nth-child(5){
            grid-column: 1/3;
            grid-row: 7/9;
        }

        img:nth-child(6){
            grid-column: 3/5;
            grid-row: 7/9;
        }

        img:nth-child(13){
            grid-column: 3/5;
            grid-row: 7/12;
        }


    </style>
</head>
<body>
    <div class="container">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen1.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen2.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen3.webp" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen4.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen5.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen6.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen7.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen8.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen9.webp" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen10.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen11.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen12.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen13.jpeg" alt="">
        <img src="/Imagenes/GaleriaG/Imagenesg/imagen14.png" alt="">

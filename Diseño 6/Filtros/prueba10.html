<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Filtros Sepia </title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            background: radial-gradient(circle, pink, red, orange);
            padding: 20px;
        }
    
        .container{
            padding: 20px 5px;
            filter: sepia(50%);
            width: 50%;
        }

    </style>
</head>
<body>
    <div class="container">
        <img src="Imagenes/Dados.png">
    </div>
</body>
</html>

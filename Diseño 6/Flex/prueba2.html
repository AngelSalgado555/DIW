<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Layout </title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .container{
            display: flex;
            flex-direction: column;
        }
        
        .caja{
            background-color: rgb(255, 64, 175);
            color: #fff;
            margin: 10px;
            padding: 10px;
            height: 150px;
            width: 150px;
        }

        .caja1{
            background-color: red;
            color: #fff;
            margin: 10px;
            padding: 10px;
            height: 150px;
            width: 150px;
        }

        .caja2{
            background-color: green;
            color: #fff;
            margin: 10px;
            padding: 10px;
            height: 150px;
            width: 150px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="caja1"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja2"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ejercicio de Grid </title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .container{
            display: grid;
            background-color: #0f0;
            grid-template-rows: 150px 150px 150px 150px 150px 150px;
            grid-template-columns: 1fr 4fr 2fr;
        }

        .caja{
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caja">1-GR</div>
        <div class="caja">2-GR</div>
        <div class="caja">3-GR</div>
        <div class="caja">4-GR</div>
        <div class="caja">5-GR</div>
        <div class="caja">6-GR</div>
        <div class="caja">7-GR</div>
        <div class="caja">8-GR</div>
        <div class="caja">9-GR</div>

</html>

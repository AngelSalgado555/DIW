<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Grid Dinámico</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        body{
            background: radial-gradient(circle, pink, red, orange);
            padding: 20px;
        }

        .container{
            display: grid;
            background: #0f0;
            grid-template-rows: repeat(3, 150px);
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            /* grid-auto-rows: 300px 100px;
            grid-auto-flow: dense; */

        }

        .caja{
            border: 2px solid #000;
            background: rgb(115, 252, 2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
        <div class="caja">4</div>
        <div class="caja">Lorem ipsum dolor sit amet consectetur adipisicing elit. Necessitatibus temporibus ipsum velit dignissimos beatae, dolor hic adipisci sequi culpa recusandae deserunt! In iste voluptate libero autem eos sunt officia consequuntur.</div>
        <div class="caja">6</div>
        <div class="caja">7</div>
        <div class="caja">8</div>
        <div class="caja">9</div>
        <div class="caja">10</div>
        <div class="caja">11</div>
        <div class="caja">12</div>
    </div>
</body>
</html>

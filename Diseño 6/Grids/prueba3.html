<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ejercicio de Grid </title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .container{
            display: grid;
            background-color: #0f0;
            grid-template-rows: 150px 150px 150px ;
            grid-template-columns: 150px 150px 150px;
        }

        .caja{
            border: 2px solid black;
            background: rgb(174, 213, 240);

        }

        .caja:first-child{
            background-color: red;
            grid-column: 1/6;
            grid-row: 1/3;
        }

        .caja:nth-child(2){
            background-color: aqua;
            grid-column: 6/8;
        }

        .caja:nth-child(3){
            background-color: rgb(167, 55, 3);
            grid-column: 6/8;
            grid-row: 2/4;
        }

        .caja:nth-child(4){
            background-color: yellow;
            grid-column: 1/6;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="caja">1-GR</div>
        <div class="caja">2-GR</div>
        <div class="caja">3-GR</div>
        <div class="caja">4-GR</div>
        <div class="caja">5-GR</div>
        <div class="caja">6-GR</div>
        <div class="caja">7-GR</div>
        <div class="caja">8-GR</div>
        <div class="caja">9-GR</div>
        <div class="caja">1-GR</div>
        <div class="caja">2-GR</div>
        <div class="caja">3-GR</div>
        <div class="caja">4-GR</div>
        <div class="caja">5-GR</div>
        <div class="caja">6-GR</div>
        <div class="caja">7-GR</div>
        <div class="caja">8-GR</div>
        <div class="caja">9-GR</div>
    </div>
</body>
</html>

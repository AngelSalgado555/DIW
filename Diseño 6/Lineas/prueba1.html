<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Practicando lineas </title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        body{
            background: radial-gradient(circle, pink, red, orange);
            padding: 20px;
        }

        .container{
            display: grid;
            background: gray;
            grid-template-rows: 
            [line1]
            150px
            [line2]
            150px
            [line3]
            150px
            [linefinal];

            grid-template-columns: 
            [lineainicial]
            150px 
            150px
            150px
            [lineafinal];
        }

        .caja{
            border: 2px solid black;
            background: rgb(115, 252, 2);
            font-size: 50px;
            padding: 70px;
        }

        .caja:first-child{
            background: rgb(0, 174, 255);
            grid-row: line1/line3;
            grid-column: 1/lineafinal;
        }

        .caja:nth-child(7){
            background-color: cyan;
        }

        .caja:last-child{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caja">1</div>
        <div class="caja">2</div>
        <div class="caja">3</div>
        <div class="caja">4</div>
        <div class="caja">5</div>
        <div class="caja">6</div>
        <div class="caja">7</div>
        <div class="caja">8</div>
        <div class="caja">9</div>
    </div>
</body>
</html>

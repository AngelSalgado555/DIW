<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Transform Scale </title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            background: radial-gradient(circle, pink, red, orange);
            padding: 20px;
        }
        .container{
            padding: 20px 5px;
            background: lightskyblue;
        }

        .caja{
            background-color: lightyellow;
            height: 150px;
            width: 150px;
            margin: 20px;
            display: flex;
            transform: scale(1.2, 1.5);
            
        }

        b{
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caja">
            <b>Angel Salgado</b>
        </div>
    </div>
</body>
</html>

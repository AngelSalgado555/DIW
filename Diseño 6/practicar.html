<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Practicar un Formulario simple </title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(211, 139, 183);
            width: 1300px;
            height: 400px;
            
            
        }

        .caja1{
            background-repeat: no-repeat;
            background-image: url(/Imagenes/images.jpeg);
            margin: 60px;
            margin-top: 80px;
            min-width: 200px;
            width: 200px;
            height: 300px;
        }

        .caja2 form{
            justify-content: space-between;
            margin: 40px;
            margin-left: 140px;
            width: 400px;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            
        }

        form input{
            text-align: center;
            width: 500px;
            font-family:fantasy;
            background-color: rgb(218, 90, 165);
            border-bottom: 5px solid white;
            border: inherit;
        }

        .comentario{
            height: 130px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="caja1">
            
        </div>
        <div class="caja2">
            <form>
                <input type="text" name="correo" placeholder="Correo Electronico">
                <br>
                <input type="text" name="contraseña" placeholder="Introduce la contraseña">
                <br>
                <input type="text" name="comentario" placeholder="Comentario (opcional)" class="comentario">
                <br>
                <input type="submit" name="enviar" >
            </form>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Practicar un Formulario simple </title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .flex-container{
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            background: rgb(236, 161, 214);
            margin: 50px auto;
            padding: 30px;
            border-radius: 25px;
            max-width: 1000px;
        }

        .img-container{
            background-repeat: no-repeat;
            
        }

        .form-inscrip{
            min-width: 400px;
            flex: 1;
            text-align: center;
            padding: 40px;
            
        }

        .form_imput{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-bottom: 3px solid #fff;
            background: #ea7fee33;
            color: white;
        }

        .form_imput:focus{
            background: linear-gradient(to bottom, transparent, #1e9cd688);
            outline: none;
            border-bottom: 3px solid rgb(233, 87, 213);
        }


        .form textarea{
            min-height: 150px;
            resize: none;
        }

        .form-img{
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="flex-container">
            <form class="form-inscrip">
                <div class="form_imput">
                    <input type="text" name="correo" placeholder="Correo Electronico">
                </div>
                <div class="form_imput">
                    <input type="text" name="contraseña" placeholder="Introduce la contraseña">
                </div>
                <div class="form_imput">
                    <input type="text" name="comentario" placeholder="Comentario (opcional)" class="comentario">
                </div>
                <div class="form_imput">
                    <textarea class="form_imput" placeholder="Mensaje">
                    </textarea>
                </div>
                <div class="form_imput">
                    <input type="submit" name="enviar" >
                </div>
            </form>
            <div class="form-img"> 
                <div class="img-container">
                    <img src="/Imagenes/images.jpeg">
                </div>
            </div>
    </div>
</body>
</html>

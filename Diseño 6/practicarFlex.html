<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Con Flex </title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            background: radial-gradient(circle, pink, red, orange);
            padding: 20px;
        }

        .container{
            display: flex;
            background: gray;
            flex-direction: column;
            height: 100vh;
        }

        .header, .main, .aside, .footer{
            padding: 20px;
        }

        .header{
            background-color: rgb(171, 242, 245);
            height: 20vh;
            
        }

        .main{
            background-color: rgb(236, 138, 73);
            
        }

        .aside{
            background-color: pink;
            
        }

        .footer{
            background-color: lime;
            height: 20vh;
        }

        @media screen and (min-width: 700px) {
            .container{
                height: 100vh;
            }

            .contenido-mid{
                display: flex;
                flex: 1;
            }

            .main{
                flex: 3;
            }

            .aside{
                flex: 1;
            }
            
        }

    </style>
</head>
<body>
    <div class="container">
        <header class="header">Con Flex </header>
            <div class="contenido-mid">
                <main class="main">Main</main>
                <aside class="aside">Aside </aside>
            </div>
        <footer class="footer">Footer</footer>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Con Flex </title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        body{
            background: radial-gradient(circle, pink, red, orange);
        }

        .container{
            display: flex;
            background: gray;
            flex-direction: column;
            height: 100vh;
        }

        .header, .main, .aside, .footer{
            padding: 20px;
        }

        .header{
            background-color: rgb(171, 242, 245);
            flex-basis: 70px;
            
        }

        .main{
            background-color: rgb(236, 138, 73);
            flex-basis: 150px;
            flex-grow: 1;
            flex-shrink: 0;
            
        }

        .aside{
            background-color: pink;
            flex-basis: 200px;
            flex-grow: 1;
            flex-shrink: 0;
        }

        .footer{
            background-color: lime;
            flex-basis: 50px;
            flex-grow: 1;
        }

        @media screen and (min-width: 700px) {
            .container{
                display: flex;
                flex-direction: row;
            }

            
        }

    </style>
</head>
<body>
    <div class="container">
        <header class="header">Con Flex </header>
        <main class="main">Main</main>
        <aside class="aside">Aside </aside>
        <footer class="footer">Footer</footer>
    </div>
</body>
</html>

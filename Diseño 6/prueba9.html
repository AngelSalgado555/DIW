<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Flex </title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .container{
            display: flex;
            height: 100vh;
            background-color: rgb(98, 228, 98);
        }

        .caja1{
            background-color: pink;
            color: #fff;
            min-width: 150px;
            height: 150px;
            width: 400px;
        }

        .caja2{
            background-color: red;
            color: #fff;
            min-width: 150px;
            height: 150px;
            width: 400px;
        }

        .caja3{
            background-color: green;
            color: #fff;
            min-width: 150px;
            height: 150px;
            width: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caja1"></div>
        <div class="caja2"></div>
        <div class="caja3"></div>
    </div>
</body>
</html>

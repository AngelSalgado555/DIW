<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Medidas </title>
    <style>
        
        .caja1 {
            width: 180px;
            height: 76px;
            background-color: red;
        }

        .caja2{
            height: 76px;
            width: 320px;
            background-color: red;
        }

        .caja3{
            width: 45%;
            height: 20px;
            background-color: green;
        }

        .caja4{
            height: 76px;
            width: 330px;
            background-color: red;
        }

        .caja5{
            width: 80%;
            height: 20px;
            background-color: green;
        }
    </style>
</head>

<body>
    <div class="caja1">
        Parrafo 1
    </div>
    <hr>
    <div class="caja2">
        <div class="caja3">
            Parrafo 2
        </div>
    </div>
    <hr>
    <div class="caja4">
        <div class="caja5">
            Parrafo 3
        </div>
    </div>
</body>

</html>
